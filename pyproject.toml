[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "loraforge"
dynamic = ["version"]
description = "Building blocks for LoRA compression and efficient execution"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "LoRAForge contributors"}]
dependencies = []
classifiers = [
  "Development Status :: 1 - Planning",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = ["build>=1", "pytest>=8", "ruff>=0.9"]
gpu = ["torch>=2.7", "ninja>=1.11"]
adapters = ["torch>=2.7", "safetensors>=0.5"]
test-adapters = ["peft==0.18.0", "transformers>=4.52,<5", "pytest>=8"]
docs = [
  "sphinx>=8.2,<9",
  "myst-parser>=4,<5",
  "pydata-sphinx-theme>=0.24,<0.25",
  "sphinx-design>=0.7,<0.8",
  "sphinx-copybutton>=0.5,<0.6",
]

[project.entry-points."sglang.srt.plugins"]
loraforge = "loraforge.integrations.sglang:install"

[project.urls]
Repository = "https://github.com/lishenghui/loraforge"
Issues = "https://github.com/lishenghui/loraforge/issues"
Documentation = "https://lishenghui.github.io/loraforge/"

[tool.setuptools.dynamic]
version = {attr = "loraforge._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
loraforge = ["py.typed", "ops/csrc/*.cpp", "ops/csrc/*.cu", "integrations/data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -ra"
markers = ["gpu: requires an allocated CUDA/ROCm GPU and a matching compiler"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
