name: CPU checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Classify the complete PR diff
        id: scope
        run: |
          python - <<'PYTHON'
          import json
          import os
          import subprocess
          from pathlib import Path

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          code = True  # Main and manual runs always check the full matrix.
          if os.environ["GITHUB_EVENT_NAME"] == "pull_request":
              pr = event["pull_request"]
              paths = subprocess.check_output([
                  "git", "diff", "--no-renames", "--name-only", "-z",
                  pr["base"]["sha"] + "..." + pr["head"]["sha"],
              ]).decode().split("\0")
              paths = [p for p in paths if p]
              code = not paths or any(
                  not (p.startswith("docs/") or p.endswith(".md"))
                  for p in paths
              )
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"code={str(code).lower()}\n")
          print(f"Run CPU/package matrices: {code}")
          PYTHON

  package:
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install development tools
        run: python -m pip install ".[dev]"
      - name: Lint and format
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Build source archive and wheel
        run: python -m build
      - name: Test installed wheel
        run: |
          python -m venv /tmp/loraforge-wheel
          /tmp/loraforge-wheel/bin/python -m pip install pytest dist/*.whl
          /tmp/loraforge-wheel/bin/python -m pytest
      - name: Test wheel rebuilt from source archive
        run: |
          mkdir /tmp/loraforge-sdist
          python -m pip wheel --no-deps --wheel-dir /tmp/loraforge-sdist dist/*.tar.gz
          python -m venv /tmp/loraforge-source
          /tmp/loraforge-source/bin/python -m pip install pytest /tmp/loraforge-sdist/*.whl
          /tmp/loraforge-source/bin/python -m pytest

  adapters:
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install CPU tensor and PEFT dependencies
        run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install ".[adapters,test-adapters]"
      - name: Test CPU library and real PEFT loading
        run: python -m pytest -m "not gpu" -v
